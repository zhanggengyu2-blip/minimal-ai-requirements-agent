name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  contract:
    runs-on: ubuntu-latest
    env:
      SHARED_PASSWORD: contract-check-password
      AUTH_HMAC_KEY: contract-check-auth-key-01234567890123456789
      INVITATION_ENCRYPTION_KEY: contract-check-invite-key-0123456789012345
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install contract generators
        run: |
          python -m pip install -e backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Regenerate OpenAPI and TypeScript
        run: |
          python backend/scripts/generate_openapi.py
          pnpm --dir frontend run generate:api
      - name: Check generated files are committed
        run: git diff --exit-code -- backend/app/openapi.json backend/docs/openapi-v2.0-apifox.json frontend/src/api/generated.ts

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
      SHARED_PASSWORD: e2e-shared-password
      AUTH_HMAC_KEY: e2e-auth-key-012345678901234567890123
      INVITATION_ENCRYPTION_KEY: e2e-invite-key-012345678901234567890
      E2E_SHARED_PASSWORD: e2e-shared-password
      E2E_ADMIN_DEPARTMENT: 产品部
      E2E_ADMIN_NAME: E2E管理员
      E2E_COO_FIXTURE: '1'
      COO_BASE_URL: http://127.0.0.1:8416/v1
      COO_API_KEY: controlled-test-fixture
      COO_MODEL: controlled-fixture-NOT-REAL-LLM
      KNOWLEDGE_EMBEDDING_BASE_URL: http://127.0.0.1:8416/v1
      KNOWLEDGE_EMBEDDING_API_KEY: controlled-test-fixture
      KNOWLEDGE_EMBEDDING_MODEL: controlled-embedding
      KNOWLEDGE_RERANK_BASE_URL: http://127.0.0.1:8416/v1
      KNOWLEDGE_RERANK_API_KEY: controlled-test-fixture
      KNOWLEDGE_RERANK_MODEL: controlled-rerank
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install application and browser
        run: |
          python -m pip install -e 'backend[dev]'
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Prepare disposable database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.db.seed
          python scripts/bootstrap_admin.py --department "${E2E_ADMIN_DEPARTMENT}" --name "${E2E_ADMIN_NAME}"
      - name: Start application
        run: |
          python backend/tests/model_fixture_server.py > "${RUNNER_TEMP}/model-fixture.log" 2>&1 &
          python backend/scripts/run_v4.py > "${RUNNER_TEMP}/backend.log" 2>&1 &
          pnpm --dir frontend run dev > "${RUNNER_TEMP}/frontend.log" 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/v1/ready && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/api/v1/ready
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:3000 && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000 > /dev/null
      - name: Run Playwright critical flow
        working-directory: frontend
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
